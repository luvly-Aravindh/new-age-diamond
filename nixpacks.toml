# Nixpacks build: Vite SPA built to dist/ and served as static files.
# Vite 7 needs Node 20.19+, so pin Node 22.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
# --include=dev: vite and tailwind are devDependencies and are needed to build
cmds = ["npm ci --include=dev", "npm install -g serve@14"]

[phases.build]
cmds = ["npm run build"]

[start]
# -s = SPA fallback to index.html (same as public/_redirects on Netlify)
cmd = "serve -s dist -l tcp://0.0.0.0:${PORT:-3000}"
